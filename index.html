<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Three JS</title>
		<style>
			body {
				margin: 0;
				overflow: hidden;
			}
			canvas {
				display: block;
			}
			#info-block {
				display: block;
				position: absolute;
				top: 10px;
				left: 10px;
				background-color: rgb(20, 68, 35);
				padding: 15px;
				border-radius: 10px;
				white-space: pre-line;
				line-height: 1.4;
				max-height: 70vh;
				overflow-y: auto;
				color: #ffffff;
				font-family: Arial, Helvetica, sans-serif;

				max-height: 70vh;
				overflow-y: auto;
				opacity: 0;
				transform: translateY(-20px);
				transition: opacity 0.2s ease, transform 0.2s ease;
				max-width: 400px;
				z-index: 1000;
			}
			#info-block a {
				color: #87ceeb; /* Голубой цвет как в сцене */
				text-decoration: underline;
				cursor: pointer;
			}

			#info-block a:hover {
				color: #ffffff; /* Белый при наведении */
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<div id="info-block">Some text</div>
		<script src="./index.js" type="module"></script>
	</body>
</html>
